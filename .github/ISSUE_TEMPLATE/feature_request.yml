name: Feature request
description: Suggest an improvement or supported use case
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user need, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public tariff source, if applicable
      description: Provide the official URL and effective date for a rate-related request.
